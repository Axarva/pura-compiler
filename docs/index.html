<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pura: UI指向関数型言語</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Language Switcher Button */
        .lang-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            background: rgba(255,255,255,0.8);
            border: 1px solid #ccc;
            padding: 5px 10px;
            border-radius: 4px;
            text-decoration: none;
            color: #333;
            font-family: sans-serif;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .lang-switch:hover { background: #eee; }
        #qr {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            background: rgba(255,255,255,0.8);
            border: 1px solid #ccc;
            padding: 5px 10px;
            border-radius: 4px;
            text-decoration: none;
            color: #333;
            font-family: sans-serif;
            font-size: 0.8rem;
            transition: 0.2s;
            max-width: 5vw;
        }

    </style>
</head>
<body>
    <img id="qr" src="qr.webp" alt="QR Code">
    <a href="https://axarva.me/pura-compiler/en" class="lang-switch">🇬🇧 English Version</a>
    
    <div id="app"></div>

    <script src="presentation_ja.pura.js"></script>
</body>
</html>
